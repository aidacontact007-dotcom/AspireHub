<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AspireHub – Discover. Develop. Achieve.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
<style>
:root{--navy:#0b2447;--navy2:#143866;--sky:#bfe0ff;--purple:#6d4aff;--orange:#ff8a3d;--grey:#f3f5f9;--ink:#14203a;--muted:#5d6b86;--line:#e4e9f3;--card:#fff;
 --shadow:0 1px 2px rgba(11,36,71,.05),0 8px 28px -10px rgba(11,36,71,.14);--r:18px;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#fbfcff;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Poppins,Inter,sans-serif;color:var(--navy);line-height:1.2;letter-spacing:-.015em}h1{font-size:clamp(1.8rem,4vw,2.5rem);margin:.2em 0 .5em}h2{font-size:clamp(1.5rem,3vw,2.1rem);margin:0 0 .6em}h3{font-size:1.15rem;margin:.5em 0 .3em}
a{color:var(--purple);text-underline-offset:3px}.wrap{max-width:1140px;margin:auto;padding:0 24px}
nav{background:rgba(9,29,58,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);color:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.08)}
nav .wrap{display:flex;align-items:center;gap:22px;min-height:68px;flex-wrap:wrap}nav a{color:#fff}
nav .logo{font-family:Poppins,sans-serif;font-weight:700;font-size:1.3rem;text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:10px;letter-spacing:-.02em}
nav .logo::before{content:"";width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--orange),var(--purple));box-shadow:0 4px 14px rgba(109,74,255,.5)}
nav a.l{text-decoration:none;opacity:.78;font-size:.95rem;font-weight:500;transition:opacity .15s}nav a.l:hover{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:99px;border:0;font:600 .95rem Inter,system-ui,sans-serif;background:linear-gradient(180deg,#ff9a55,var(--orange));color:#2a1604;text-decoration:none;cursor:pointer;box-shadow:0 6px 18px -6px rgba(255,138,61,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.alt{background:#fff;color:var(--navy);box-shadow:0 0 0 1px var(--line),0 2px 8px -4px rgba(11,36,71,.2)}nav .btn.alt{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
@media(prefers-reduced-motion:no-preference){.btn{transition:transform .15s,box-shadow .15s}.btn:hover:not(:disabled){transform:translateY(-2px)}article.card{transition:border-color .2s,box-shadow .2s}}
.hero{position:relative;overflow:hidden;color:#fff;padding:104px 0 88px;background:radial-gradient(900px 480px at 85% -10%,rgba(109,74,255,.55),transparent 60%),radial-gradient(700px 420px at 0% 110%,rgba(255,138,61,.28),transparent 60%),linear-gradient(165deg,#081c3c,#0e2d58 60%,#143866)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);pointer-events:none}
.hero .wrap{position:relative;z-index:1}.hero h1{color:#fff;font-size:clamp(2.4rem,6.4vw,4.6rem);font-weight:700;line-height:1.04;letter-spacing:-.035em;max-width:13em;margin:0 0 22px}
.hero p{max-width:34em;color:#c9dcf5;font-size:1.12rem}.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:54px}.chips span{padding:9px 18px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);font-weight:600;font-size:.9rem}
.chips span:nth-child(1){box-shadow:inset 3px 0 0 var(--purple)}.chips span:nth-child(2){box-shadow:inset 3px 0 0 var(--sky)}.chips span:nth-child(3){box-shadow:inset 3px 0 0 var(--orange)}
section{padding:80px 0}section.grey{background:linear-gradient(180deg,var(--grey),#eef2f9)}.sub{color:var(--muted);max-width:40em;margin:-.2em 0 2em}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}article.card:hover{border-color:#c9d3ea;box-shadow:0 1px 2px rgba(11,36,71,.06),0 18px 40px -16px rgba(11,36,71,.22)}.card h3 a{color:var(--navy);text-decoration:none}.card h3 a:hover{color:var(--purple)}
.panel{border-radius:24px;padding:34px;border:1px solid transparent;min-height:230px}.panel h3{font-size:1.5rem;margin-top:0}.panel p{color:#3b4a68;margin:0}
.p1{background:linear-gradient(160deg,#efeaff,#fff 70%);border-color:#ded5ff}.p2{background:linear-gradient(160deg,#e3f1ff,#fff 70%);border-color:#c9e1fb}.p3{background:linear-gradient(160deg,#fff0e4,#fff 70%);border-color:#ffd9bd}
.step{position:relative;padding-left:64px}.step b{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 1.1rem Poppins,sans-serif}
.tag{display:inline-block;background:#eaf3ff;color:var(--navy);border-radius:99px;padding:3px 12px;font-size:.78rem;font-weight:600;margin:0 6px 4px 0}.tag.demo{background:#ffe9d6;color:#8a4310}
.muted,.empty{color:var(--muted)}.empty{padding:14px 0}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.statrow>div{padding:30px;border-right:1px solid var(--line)}.statrow>div:last-child{border:0}
.stats .n,.n{font:700 2.6rem Poppins,sans-serif;color:var(--navy);line-height:1;margin-bottom:6px}
.band{background:linear-gradient(135deg,var(--navy),#241b6b);color:#fff;border-radius:28px;padding:56px;text-align:center}.band h2{color:#fff}.band p{color:#c9dcf5;margin:0 auto 24px;max-width:32em}
footer{background:#081c3c;color:#a9bddb;padding:56px 0 36px;font-size:.92rem}footer h4{color:#fff;margin:0 0 10px;font-size:1rem}footer a{color:#a9bddb;display:block;text-decoration:none;margin:5px 0}footer a:hover{color:#fff}.fcols{display:grid;gap:32px;grid-template-columns:2fr 1fr 1fr}.fine{border-top:1px solid rgba(255,255,255,.1);margin-top:32px;padding-top:20px}@media(max-width:640px){.fcols{grid-template-columns:1fr}}
.authbox{max-width:440px;margin:56px auto;padding:36px}label{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px;color:var(--navy)}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid #cfd8ea;border-radius:12px;font:inherit;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}input:focus,select:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(109,74,255,.14);outline:0}
textarea{min-height:100px}.msg{padding:12px 16px;border-radius:12px;margin:14px 0;font-size:.95rem}.msg.err{background:#ffeaea;color:#8a1111}.msg.ok{background:#e0f7e8;color:#14602b}.msg.warn{background:#fff3d9;color:#6b4a00}
.opt{display:flex;gap:10px;align-items:center;font-weight:400;margin:8px 0;color:var(--ink);cursor:pointer}.opt input{width:18px;height:18px;accent-color:var(--purple);padding:0}
fieldset{border:1px solid var(--line);border-radius:var(--r);margin:18px 0;padding:14px 22px;background:#fff}legend{font-weight:600;padding:0 8px;color:var(--navy)}
.prog{height:10px;background:#e8edf7;border-radius:99px;overflow:hidden;margin:14px 0}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--orange));border-radius:99px}
.bar{display:flex;align-items:center;gap:12px;margin:9px 0}.bar b{flex:0 0 170px;font-weight:600;font-size:.92rem}.bar span{flex:1;height:12px;background:#e8edf7;border-radius:99px;overflow:hidden}.bar span i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--purple));border-radius:99px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}.two{display:grid;gap:0 18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.pager{justify-content:center;margin-top:28px}
.sk{display:grid;grid-template-columns:1fr 160px auto;gap:12px;align-items:center;margin:10px 0}@media(max-width:560px){.sk{grid-template-columns:1fr}.bar b{flex-basis:110px}}
.opt-list{padding-left:18px;margin:6px 0;font-size:.9rem;color:#3b4a68}
main.wrap>p:first-child:has(a + a){font-size:0;display:flex;flex-wrap:wrap;gap:4px;background:#fff;border:1px solid var(--line);padding:6px;border-radius:99px;box-shadow:var(--shadow);width:fit-content;max-width:100%;margin:0 0 22px}
main.wrap>p:first-child:has(a + a) a{font-size:.88rem;font-weight:600;padding:8px 16px;border-radius:99px;text-decoration:none;color:var(--navy)}main.wrap>p:first-child:has(a + a) a:hover{background:#eef2fb}

/* ===== Design enhancement layer ===== */
:root{--purple-d:#5636e6;--ring:0 0 0 4px rgba(109,74,255,.14);--shadow-lg:0 2px 4px rgba(11,36,71,.05),0 24px 56px -20px rgba(11,36,71,.28)}
body{background:#fbfcff;background-image:radial-gradient(900px 400px at 100% 0,rgba(109,74,255,.05),transparent 70%)}
::selection{background:rgba(109,74,255,.22)}
h1{font-weight:700}h2{font-weight:700}
/* nav */
nav{box-shadow:0 8px 30px -18px rgba(0,0,0,.6)}
nav a.l{position:relative;padding:6px 2px}
nav a.l::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--orange),var(--purple));transform:scaleX(0);transition:transform .25s}
nav a.l:hover::after,nav a.l[aria-current]::after{transform:scaleX(1)}nav a.l[aria-current]{opacity:1}
#navAuth{display:flex;align-items:center;gap:18px}
nav .btn{padding:9px 20px;font-size:.9rem}
/* buttons */
.btn:hover:not(:disabled){box-shadow:0 12px 26px -8px rgba(255,138,61,.75),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.alt:hover:not(:disabled){box-shadow:0 0 0 1px #c9d3ea,0 10px 22px -10px rgba(11,36,71,.3)}
.hero .btn.alt,nav .btn.alt:hover{background:rgba(255,255,255,.18)}
/* hero */
.hero{padding:96px 0 104px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:.82rem;font-weight:600;color:#e4eeff;margin-bottom:22px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(255,138,61,.28)}
.hero h1{font-size:clamp(2.3rem,5.4vw,4rem);max-width:12em;background:linear-gradient(180deg,#fff 30%,#c9dcf5);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.chips{margin-top:44px}
.hero-visual{position:relative;min-height:340px}
.hv-card{position:absolute;background:rgba(255,255,255,.96);color:var(--ink);border-radius:20px;padding:18px 20px;box-shadow:0 30px 60px -24px rgba(0,0,0,.55)}
.hv-main{inset:20px 0 auto 24px;transform:rotate(-2deg)}
.hv-main .t{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hv-main b{font:700 1.02rem Poppins,sans-serif;color:var(--navy)}
.hv-main small{display:block;color:var(--muted);margin-top:2px}
.hv-pct{font:700 .85rem Poppins,sans-serif;color:#0f6a37;background:#dcf6e6;border-radius:99px;padding:5px 12px;white-space:nowrap}
.hv-main ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;font-size:.85rem;color:#3b4a68}
.hv-main li::before{content:"✓";color:var(--purple);font-weight:700;margin-right:8px}
.hv-skill{inset:auto auto 8px 0;width:220px;transform:rotate(2.5deg)}
.hv-skill .r{display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;color:var(--navy);margin:8px 0 4px}
.hv-skill i{display:block;height:8px;border-radius:99px;background:#e8edf7;position:relative;overflow:hidden}
.hv-skill i::after{content:"";position:absolute;inset:0 var(--w) 0 0;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--orange))}
.hv-badge{inset:auto 0 56px auto;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:600;font-size:.85rem;transform:rotate(-1.5deg)}
.hv-badge span{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--purple));display:block}
@media(prefers-reduced-motion:no-preference){.hv-main{animation:fl 7s ease-in-out infinite}.hv-skill{animation:fl 8s ease-in-out -2s infinite}.hv-badge{animation:fl 9s ease-in-out -4s infinite}
@keyframes fl{50%{translate:0 -10px}}
section>.wrap{animation:rise .7s both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}.hero-visual{display:none}.hero{padding:72px 0 64px}}
/* sections */
section{padding:88px 0}
section>.wrap>h2:first-child{position:relative;padding-top:18px}
section>.wrap>h2:first-child::before{content:"";position:absolute;top:0;left:0;width:44px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--orange),var(--purple))}
.sub{font-size:1.04rem}
/* cards */
.card{transition:transform .2s,border-color .2s,box-shadow .2s}
article.card{display:flex;flex-direction:column;gap:2px}
article.card:hover{transform:translateY(-4px)}
article.card h3{font-size:1.08rem;margin:.55em 0 .25em}article.card p{margin:.15em 0}
article.card .btn{margin-top:auto;align-self:flex-start}
article.card>p.muted{margin-top:auto!important;padding-top:12px;border-top:1px dashed var(--line);font-size:.86rem}
.card:not(article):not(.panel):not(.authbox):hover{box-shadow:var(--shadow-lg)}
.panel{position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.panel:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.panel::after{content:"";position:absolute;right:-50px;bottom:-50px;width:170px;height:170px;border-radius:50%;opacity:.5;filter:blur(8px)}
.p1::after{background:#d9ceff}.p2::after{background:#bfe0ff}.p3::after{background:#ffd1ad}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:18px;box-shadow:0 10px 22px -10px currentColor}
.ico svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p1 .ico{background:var(--purple);color:var(--purple)}.p2 .ico{background:#2f8cf0;color:#2f8cf0}.p3 .ico{background:var(--orange);color:var(--orange)}
.tag{background:#eef0ff;color:var(--purple-d);letter-spacing:.01em}.tag.demo{background:#fff0e0;color:#a24f0c}
/* steps */
.step b{background:linear-gradient(135deg,var(--navy2),var(--purple));box-shadow:0 10px 20px -8px rgba(109,74,255,.6)}
.step{padding-top:2px}
/* stats + band */
.statrow>div{padding:34px 30px}
.stats .n,.n{background:linear-gradient(135deg,var(--navy),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.statrow>div{color:var(--muted);font-weight:500}
.band{position:relative;overflow:hidden;background:radial-gradient(500px 260px at 90% 0,rgba(255,138,61,.35),transparent 70%),radial-gradient(520px 300px at 0 100%,rgba(109,74,255,.5),transparent 70%),linear-gradient(135deg,var(--navy),#241b6b)}
.band h2{font-size:clamp(1.6rem,3.4vw,2.4rem)}
/* footer */
footer{background:linear-gradient(180deg,#081c3c,#06142b);border-top:1px solid rgba(255,255,255,.06)}
footer a{transition:color .15s,transform .15s}footer a:hover{transform:translateX(3px)}
/* forms */
label{letter-spacing:.005em}
input,select,textarea{border-color:#d5dcec;box-shadow:inset 0 1px 2px rgba(11,36,71,.04)}
input:hover,select:hover,textarea:hover{border-color:#b6c3e0}
.authbox{position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.authbox::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--orange),var(--purple))}
.authbox h1{font-size:1.7rem}
fieldset{transition:border-color .2s,box-shadow .2s}fieldset:hover{border-color:#cfd8ea;box-shadow:var(--shadow)}
.opt{padding:6px 8px;margin:2px -8px;border-radius:10px;transition:background .15s}.opt:hover{background:#f3f0ff}
.msg{border-left:4px solid currentColor}
/* data bits */
.prog,.bar span{box-shadow:inset 0 1px 2px rgba(11,36,71,.08)}
.pager span{font-weight:600;color:var(--muted)}
.empty{text-align:center;padding:36px 16px;background:#fff;border:1px dashed #cfd8ea;border-radius:var(--r);grid-column:1/-1}
/* in-app pill nav */
main.wrap>p:first-child:has(a + a) a{transition:background .15s,color .15s}
main.wrap>p:first-child:has(a + a) a[aria-current]{background:var(--navy);color:#fff}
main.wrap>h1:first-of-type,main.wrap>#msg+h1{font-size:clamp(1.7rem,3.4vw,2.3rem)}
main.wrap{animation:pg .35s both}@keyframes pg{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:640px){nav .wrap{gap:12px;padding-top:8px;padding-bottom:8px}nav a.l{font-size:.88rem}.band{padding:38px 22px}section{padding:60px 0}.statrow>div{border-right:0;border-bottom:1px solid var(--line)}}

/* ===== Profile avatar, dropdown & account pages ===== */
#navAuth{position:relative}
@media(max-width:640px){#navAuth{margin-left:auto}}
.av-wrap{position:relative;display:flex}
.avatar{width:42px;height:42px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:linear-gradient(135deg,var(--orange),var(--purple));color:#fff;font:700 1rem Poppins,sans-serif;display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative;flex:none;box-shadow:0 4px 14px -4px rgba(109,74,255,.6);transition:box-shadow .2s,border-color .2s,transform .2s}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
button.avatar:hover,button.avatar[aria-expanded="true"]{border-color:#fff;box-shadow:0 0 0 4px rgba(191,224,255,.22),0 6px 18px -4px rgba(109,74,255,.7)}
button.avatar:active{transform:scale(.95)}
button.avatar:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.av-menu{position:absolute;right:0;top:calc(100% + 12px);width:min(290px,calc(100vw - 32px));background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:8px;z-index:30;transform-origin:top right;animation:avIn .16s ease-out}
.av-menu[hidden]{display:none}
@keyframes avIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.av-head{display:flex;gap:12px;align-items:center;padding:10px 10px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.av-head .avatar{width:46px;height:46px;cursor:default;border-color:#fff;box-shadow:0 0 0 1px var(--line)}
.av-head div{min-width:0}
.av-head b{display:block;font:600 .95rem Poppins,sans-serif;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av-head small{display:block;color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av-head .tag{margin:5px 0 0;font-size:.72rem}
nav .av-menu .av-i{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--ink);font:500 .93rem Inter,system-ui,sans-serif;text-decoration:none;text-align:left;cursor:pointer;opacity:1;transition:background .15s,color .15s}
nav .av-menu .av-i:hover,nav .av-menu .av-i:focus-visible{background:#f1efff;color:var(--purple-d);outline:0}
nav .av-menu .av-i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav .av-menu .av-i.out{margin-top:6px;border-top:1px solid var(--line);border-radius:0 0 10px 10px;padding-top:12px;color:#a31616}
nav .av-menu .av-i.out:hover,nav .av-menu .av-i.out:focus-visible{background:#ffeaea;color:#8a1111}
.pf-grid{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start;margin-top:8px}

<body>
<nav><div class="wrap">
  <a class="logo" href="#/">AspireHub</a>
  <span id="navLinks" style="display:contents"></span>
  <span id="navAuth"></span>
</div></nav>
<div id="app"></div>
<footer><div class="wrap"><div class="fcols"><div><h4>AspireHub</h4><p>Discover. Develop. Achieve.<br>Connecting students, organizations and institutions.</p></div>
<div><h4>Explore</h4><span id="footLinks"></span></div>
<div><h4>Contact</h4><a href="mailto:hello@your-domain.com">hello@your-domain.com</a><span>Terms and Privacy pages are coming.</span></div></div>
<div class="fine">© AspireHub</div></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ========= CONFIG: fill in (anon/public key ONLY – never the service_role key) ========= */
const SUPABASE_URL = "https://ewbmrjwcjqflzhcgghfy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_MxtlkP9-9Ct3xoPxjUIGiQ__e4aIAxm";
/* ======================================================================================= */

const configured = !SUPABASE_URL.includes("YOUR-PROJECT");
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ROLES = { student:"Student", organization:"Organization", institution:"Educational institution", admin:"Administrator" };
let profile = null, recovery = false;

function msg(t, type = "err") { const m = $("#msg"); if (!m) return; m.textContent = t; m.className = "msg " + type; m.hidden = false; }
function busy(b, on) { b.dataset.l ??= b.textContent; b.disabled = on; b.textContent = on ? "Please wait…" : b.dataset.l; }
const go = h => { location.hash = h; };
const rep = h => location.replace(h);   // replace history entry so Back never returns to Home/Login after sign-in
/* Student-only guard for Opportunities, Programmes and opportunity details. */
async function studentOnly() {
  await loadProfile(); renderNav();
  if (!profile) { rep("#/login"); return false; }
  if (profile.status === "suspended") { await sb.auth.signOut(); profile = null; renderNav(); rep("#/login"); return false; }
  if (profile.role !== "student") { rep("#/dashboard"); return false; }
  return true;
}

async function loadProfile() {
  profile = null; if (!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  profile = data;
}
const avInner = p => `${p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : ""}<span class="ini">${esc((p.full_name || p.email || "?").trim().charAt(0).toUpperCase())}</span>`;
const PROFILE_HREF = { student: "#/profile", organization: "#/org/profile", institution: "#/inst/profile", admin: "#/admin/profile" };
const AV_ICON = { user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>', cog: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>', out: '<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>' };
function closeAv(focus) { const m = $("#avMenu"), b = $("#avBtn"); if (!m || m.hidden) return; m.hidden = true; b.setAttribute("aria-expanded", "false"); if (focus) b.focus(); }
document.addEventListener("click", e => { if (!e.target.closest(".av-wrap")) closeAv(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAv(true); });
window.addEventListener("hashchange", () => closeAv());
/* Menu per role. Guests see Home only; Opportunities and Programmes are for students only. */
const DASH = [["#/dashboard", "Dashboard"]];
const NAV_LINKS = { guest: [["#/", "Home"]], student: [...DASH, ["#/opportunities", "Opportunities"], ["#/programmes", "Programmes"]], other: DASH };
const FOOT_LINKS = { guest: [["#/", "Home"], ["#/register", "Create account"], ["#/login", "Log in"]], student: NAV_LINKS.student, other: DASH };
function renderNav() {
  const nav = $("#navAuth"), k = profile ? (profile.role === "student" ? "student" : "other") : "guest";
  $("#navLinks").innerHTML = NAV_LINKS[k].map(([h, t]) => `<a class="l" href="${h}">${t}</a>`).join("");
  $("#footLinks").innerHTML = FOOT_LINKS[k].map(([h, t]) => `<a href="${h}">${t}</a>`).join("");
  if (!profile) { nav.innerHTML = `<a class="l" href="#/login">Log in</a> <a class="btn" href="#/register">Get started</a>`; return; }
  const nm = profile.full_name || profile.email || "Account";
  nav.innerHTML = `<div class="av-wrap"><button type="button" class="avatar" id="avBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="avMenu" aria-label="Account menu for ${esc(nm)}">${avInner(profile)}</button>
    <div class="av-menu" id="avMenu" role="menu" hidden>
      <div class="av-head"><span class="avatar" aria-hidden="true">${avInner(profile)}</span><div><b>${esc(nm)}</b><small>${esc(profile.email)}</small><span class="tag">${esc(ROLES[profile.role] || profile.role)}</span></div></div>
      <a class="av-i" role="menuitem" href="${PROFILE_HREF[profile.role] || "#/dashboard"}">${AV_ICON.user}My Profile</a>
      <a class="av-i" role="menuitem" href="${profile.role === "admin" ? "#/admin/profile" : "#/account"}">${AV_ICON.cog}Account Settings</a>
      <button type="button" class="av-i out" role="menuitem" id="logout">${AV_ICON.out}Log Out</button>
    </div></div>`;
  nav.querySelectorAll(".avatar img").forEach(im => im.addEventListener("error", () => im.remove()));
  $("#avBtn").addEventListener("click", () => { const m = $("#avMenu"), open = m.hidden; m.hidden = !open; $("#avBtn").setAttribute("aria-expanded", String(open)); if (open) m.querySelector(".av-i")?.focus({ preventScroll: true }); });
  $("#avMenu").addEventListener("click", e => { if (e.target.closest("a,button")) closeAv(); });
  $("#logout").addEventListener("click", async () => { await sb.auth.signOut(); profile = null; renderNav(); go("#/"); });
}
const authBox = (title, fields, btn, extra = "") => `
  <main class="card authbox"><h1>${title}</h1>
  ${configured ? "" : '<div class="msg warn">Supabase isn\'t configured. Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script.</div>'}
  <div id="msg" class="msg" hidden role="alert"></div>
  <form id="f" novalidate>${fields}<button class="btn" type="submit" style="margin-top:18px;width:100%">${btn}</button></form>${extra}</main>`;
const EMAIL = '<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>';
const PASS = (ac = "current-password") => `<label for="pw">Password</label><input id="pw" type="password" autocomplete="${ac}" minlength="8" required>`;

/* ---------- Views ---------- */
async function home() {
  app.innerHTML = `
  <header class="hero"><div class="wrap hero-grid"><div class="hero-copy"><span class="eyebrow">For students, organizations &amp; institutions</span><h1>Your Future Starts With What You Want to Gain.</h1>
    <p>AspireHub helps students say what they want from their education and careers, then connects them with the organizations and institutions that can help them get there.</p>
    <div class="cta"><a class="btn" href="#/register">Get started</a><a class="btn alt" href="#/login" style="background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)">Log in</a></div>
    <div class="chips"><span>Exposure</span><span>Skills</span><span>Lifestyle</span></div></div>
    <div class="hero-visual" aria-hidden="true"><div class="hv-card hv-main"><div class="t"><div><b>Product Design Internship</b><small>Verified organization · Kuala Lumpur</small></div><span class="hv-pct">92% match</span></div><ul><li>Fits your aspirations: Industry exposure</li><li>Lets you develop: Communication</li><li>Open to your education level</li></ul></div>
      <div class="hv-card hv-skill"><b style="font:700 .9rem Poppins,sans-serif;color:var(--navy)">Your skills</b><div class="r"><span>Leadership</span><span>Advanced</span></div><i style="--w:20%"></i><div class="r"><span>Digital</span><span>Intermediate</span></div><i style="--w:40%"></i></div>
      <div class="hv-card hv-badge"><span></span>Transparent scoring</div></div></div></header>
  <section><div class="wrap"><h2>Three pillars of what you want to gain</h2><p class="sub">Every aspiration on AspireHub falls into one of these. Tell us which matter most and we match you accordingly.</p><div class="grid">
    <div class="card panel p1"><div class="ico"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div><h3>Exposure</h3><p>Industry visits, internships, mentorship, networking and international experiences.</p></div>
    <div class="card panel p2"><div class="ico"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div><h3>Skills</h3><p>Technical, communication, leadership, digital and entrepreneurship skills, tracked honestly.</p></div>
    <div class="card panel p3"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/></svg></div><h3>Lifestyle</h3><p>Financial independence, work-life balance, wellness, travel and personal growth.</p></div></div></div></section>
  <section class="grey"><div class="wrap"><h2>How AspireHub works</h2><div class="grid" style="margin-top:28px">
    <div class="step"><b>1</b><h3>Share your aspirations</h3><p class="muted">Answer a short questionnaire about the experiences, skills and lifestyle you want.</p></div>
    <div class="step"><b>2</b><h3>Map your skills</h3><p class="muted">Rate yourself and pick what to improve. Self-assessed skills stay clearly labelled.</p></div>
    <div class="step"><b>3</b><h3>Get matched</h3><p class="muted">See a transparent match score and exactly why each opportunity fits.</p></div></div></div></section>
  <section><div class="wrap"><h2>Built for everyone in the journey</h2><div class="grid" style="margin-top:28px">
    <div class="card"><h3>Students</h3><p class="muted">Discover opportunities that fit your goals, track applications and plan your development.</p></div>
    <div class="card"><h3>Organizations</h3><p class="muted">Publish opportunities, review applicants and find consenting talent by skills and interests.</p></div>
    <div class="card"><h3>Institutions</h3><p class="muted">Run programmes and see anonymised insights into what your students want.</p></div></div></div></section>
  <section class="grey"><div class="wrap"><h2>Platform statistics</h2><div class="statrow stats">
    <div><div class="n" id="s1">–</div>Students</div><div><div class="n" id="s2">–</div>Verified organizations</div>
    <div><div class="n" id="s3">–</div>Verified institutions</div><div><div class="n" id="s4">–</div>Published opportunities</div></div>
    <p class="muted" style="margin-top:14px">Live counts from the database.</p>
    <div class="band" style="margin-top:56px"><h2>Start with what you want to gain.</h2><p>Create a free account and tell us your aspirations in a few minutes.</p><a class="btn" href="#/register">Create your account</a></div></div></section>`;
  if (!configured) return;
  const s = await sb.rpc("public_stats");
  if (s.data) { $("#s1").textContent = s.data.students; $("#s2").textContent = s.data.organizations; $("#s3").textContent = s.data.institutions; $("#s4").textContent = s.data.opportunities; }
}

function login() {
  app.innerHTML = authBox("Log in", EMAIL + PASS(), "Log in", '<p><a href="#" id="forgot">Forgot password?</a> · <a href="#/register">Create account</a></p>');
  if (new URLSearchParams(location.search).has("suspended")) msg("This account is suspended. Contact support.");
  $("#f").addEventListener("submit", async e => {
    e.preventDefault(); if (!sb) return msg("Supabase isn't configured.");
    const b = e.target.querySelector("button"); busy(b, true);
    const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#pw").value });
    busy(b, false);
    if (error) return msg(error.message === "Email not confirmed" ? "Verify your email first, then log in." : "Incorrect email or password.");
    await loadProfile(); renderNav(); rep("#/dashboard");
  });
  $("#forgot").addEventListener("click", async e => {
    e.preventDefault(); const em = $("#email").value.trim();
    if (!sb) return msg("Supabase isn't configured.");
    if (!em) return msg("Enter your email above first.");
    const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
    error ? msg(error.message) : msg("Password reset link sent. Check your email.", "ok");
  });
}

function register() {
  app.innerHTML = authBox("Create your account",
    `<label for="name">Full name / organization name</label><input id="name" required>
     <label for="role">I am a</label><select id="role"><option value="student">Student</option><option value="organization">Organization</option><option value="institution">Educational institution</option></select>
     ${EMAIL}${PASS("new-password")}
     <label style="font-weight:400"><input id="consent" type="checkbox" style="width:auto"> I accept the Terms and Privacy Policy</label>`,
    "Create account", '<p>Already registered? <a href="#/login">Log in</a></p>');
  $("#f").addEventListener("submit", async e => {
    e.preventDefault(); if (!sb) return msg("Supabase isn't configured.");
    if ($("#pw").value.length < 8) return msg("Password must be at least 8 characters.");
    if (!$("#name").value.trim()) return msg("Enter your name.");
    if (!$("#consent").checked) return msg("Please accept the Terms and Privacy Policy.");
    const b = e.target.querySelector("button"); busy(b, true);
    // The DB trigger only honours student/organization/institution – "admin" is never accepted.
    const { data, error } = await sb.auth.signUp({ email: $("#email").value.trim(), password: $("#pw").value,
      options: { emailRedirectTo: location.origin + location.pathname, data: { full_name: $("#name").value.trim(), role: $("#role").value } } });
    busy(b, false);
    if (error) return msg(error.message);
    if (data.session) { await loadProfile(); renderNav(); return rep("#/dashboard"); }
    msg("Account created. Check your email to verify, then log in.", "ok"); e.target.reset();
  });
}

function resetPw() {
  app.innerHTML = authBox("Set a new password", `<label for="pw">New password</label><input id="pw" type="password" autocomplete="new-password" minlength="8" required>`, "Update password");
  $("#f").addEventListener("submit", async e => {
    e.preventDefault(); if ($("#pw").value.length < 8) return msg("Password must be at least 8 characters.");
    const { error } = await sb.auth.updateUser({ password: $("#pw").value });
    if (error) return msg(error.message);
    recovery = false; msg("Password updated. Redirecting…", "ok"); setTimeout(() => go("#/login"), 1200);
  });
}

function dashboard() {
  if (!profile) return go("#/login");
  if (profile.status === "suspended") { sb.auth.signOut(); profile = null; renderNav(); return go("#/login?suspended=1"); }
  app.innerHTML = `<main class="wrap" style="padding:40px 20px"><h1>Welcome, ${esc(profile.full_name || profile.email)}</h1>
    <p><span class="tag">${esc(ROLES[profile.role])}</span></p>
    <p class="muted">The ${esc(ROLES[profile.role].toLowerCase())} portal is built in a later phase. Role detection and access protection already work.</p></main>`;
}

/* ---------- Student portal (Phase 2) ---------- */
const STEPS = [["exposure","Exposure"],["skills","Skills"],["lifestyle","Lifestyle"],["goals","Goals"]];
const LEVELS = ["Beginner","Basic","Intermediate","Advanced","Expert"];
const CATS = [["technical","Technical skills"],["soft","Soft skills"],["professional","Professional skills"]];
const num = v => v === "" ? null : Number(v);
async function guard() { await loadProfile(); renderNav(); if (!profile || profile.role !== "student") { go("#/login"); return false; } return true; }
const shell = inner => app.innerHTML = `<main class="wrap" style="padding:32px 20px">
  <p><a href="#/dashboard">Dashboard</a> · <a href="#/profile">Profile</a> · <a href="#/aspirations">Aspirations</a> · <a href="#/skills">Skills</a> · <a href="#/opportunities">Opportunities</a> · <a href="#/recommended">Recommended</a> · <a href="#/saved">Saved</a> · <a href="#/applications">Applications</a></p>
  <div id="msg" class="msg" hidden role="alert"></div>${inner}</main>`;
const loadErr = () => { shell(""); msg("Couldn't load your data. Refresh to try again."); };

async function profileView() {
  if (!await guard()) return;
  shell('<p class="empty">Loading…</p>');
  const { data: s, error } = await sb.from("students").select("*").eq("id", profile.id).single();
  if (error) return loadErr();
  const inp = (id, label, v, type = "text") => `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(v)}"></div>`;
  const lv = ["Secondary","Foundation / Pre-U","Diploma","Bachelor's degree","Master's degree","PhD","Other"];
  shell(`<h1>My profile</h1><form id="f" novalidate><div class="two">
    ${inp("full_name","Full name",profile.full_name)}${inp("phone","Phone (optional)",s.phone,"tel")}
    ${inp("country_code","Country code (e.g. MY)",s.country_code)}${inp("state","State",s.state)}${inp("city","City",s.city)}
    ${inp("institution_name","Educational institution",s.institution_name)}
    <div><label for="education_level">Education level</label><select id="education_level"><option value="">Select…</option>${lv.map(x => `<option ${x === s.education_level ? "selected" : ""}>${x}</option>`).join("")}</select></div>
    ${inp("field_of_study","Course / field of study",s.field_of_study)}${inp("study_year","Study year",s.study_year,"number")}${inp("graduation_year","Graduation year",s.graduation_year,"number")}
    <div><label for="language">Preferred language</label><select id="language"><option value="en" ${profile.language === "en" ? "selected" : ""}>English</option><option value="ms" ${profile.language === "ms" ? "selected" : ""}>Bahasa Malaysia</option></select></div></div>
    <label for="bio">Biography</label><textarea id="bio">${esc(s.bio)}</textarea>
    <fieldset><legend>Sharing consent (off by default)</legend>
    <label class="opt"><input type="checkbox" id="c1" ${s.share_with_organizations ? "checked" : ""}> Let verified organizations find me in talent discovery</label>
    <label class="opt"><input type="checkbox" id="c2" ${s.share_with_institution ? "checked" : ""}> Include my data in my institution's anonymised insights</label></fieldset>
    <p class="muted">Your email: ${esc(profile.email)}. Profile photo upload needs Supabase Storage and comes in a later step.</p>
    <button class="btn" type="submit">Save profile</button></form>`);
  $("#f").addEventListener("submit", async e => {
    e.preventDefault(); const b = e.target.querySelector("button"), v = id => $("#" + id).value.trim();
    const cc = v("country_code").toUpperCase();
    if (!v("full_name")) return msg("Enter your full name.");
    if (cc && !/^[A-Z]{2}$/.test(cc)) return msg("Country code must be 2 letters, e.g. MY.");
    const sy = num(v("study_year")), gy = num(v("graduation_year"));
    if ((sy !== null && (sy < 1 || sy > 10)) || (gy !== null && (gy < 1990 || gy > 2100))) return msg("Check your study year and graduation year.");
    busy(b, true);
    const r1 = await sb.from("students").update({ phone: v("phone") || null, country_code: cc || null, state: v("state") || null, city: v("city") || null, institution_name: v("institution_name") || null,
      education_level: v("education_level") || null, field_of_study: v("field_of_study") || null, study_year: sy, graduation_year: gy, bio: v("bio") || null,
      share_with_organizations: $("#c1").checked, share_with_institution: $("#c2").checked }).eq("id", profile.id);
    const r2 = await sb.from("profiles").update({ full_name: v("full_name"), language: v("language") }).eq("id", profile.id);
    busy(b, false);
    if (r1.error || r2.error) return msg("Couldn't save your profile. Try again.");
    profile.full_name = v("full_name"); profile.language = v("language"); msg("Profile saved.", "ok");
  });
}

async function aspView() {
  if (!await guard()) return;
  shell('<p class="empty">Loading…</p>');
  const [q, o, r, st] = await Promise.all([
    sb.from("aspiration_questions").select("*").eq("is_active", true).order("sort"),
    sb.from("aspiration_options").select("*").eq("is_active", true).order("sort"),
    sb.from("aspiration_responses").select("*").eq("student_id", profile.id),
    sb.from("students").select("questionnaire_submitted_at").eq("id", profile.id).single()]);
  if (q.error || o.error || r.error || st.error) return loadErr();
  if (!q.data.length) return shell('<p class="empty">No questions available yet. Run sql/02_student.sql.</p>');
  const ans = {}; r.data.forEach(x => ans[x.question_id] = { ids: new Set(x.option_ids), text: x.text_answer || "" });
  let step = 0, submitted = !!st.data.questionnaire_submitted_at;
  const qs = () => q.data.filter(x => x.section === STEPS[step][0]);
  const collect = () => qs().forEach(x => {
    if (x.kind === "text") ans[x.id] = { ids: new Set(), text: $("#t" + x.id).value.trim() };
    else ans[x.id] = { ids: new Set([...document.querySelectorAll(`[name="${x.id}"]:checked`)].map(i => i.value)), text: "" };
  });
  const save = async () => {
    const rows = Object.entries(ans).map(([qid, a]) => ({ student_id: profile.id, question_id: qid, option_ids: [...a.ids], text_answer: a.text || null, updated_at: new Date().toISOString() }));
    return rows.length ? (await sb.from("aspiration_responses").upsert(rows, { onConflict: "student_id,question_id" })).error : null;
  };
  const draw = () => {
    shell(`<h1>My aspirations</h1><p class="muted">${submitted ? "Submitted – you can edit and resubmit anytime." : "In progress."} Step ${step + 1} of ${STEPS.length}: ${STEPS[step][1]}</p>
      <div class="prog"><i style="width:${(step + 1) / STEPS.length * 100}%"></i></div>
      ${qs().map(x => `<fieldset><legend>${esc(x.prompt)}${x.kind === "multi" ? " (choose all that apply)" : ""}</legend>${x.kind === "text"

    const act = async fn => { collect(); const bs = document.querySelectorAll(".row .btn"); bs.forEach(b => b.disabled = true); await fn(); bs.forEach(b => b.disabled = false); };

    $("#next").onclick = () => act(async () => {

      if (u.error) return msg("Couldn't submit. Try again.");
      submitted = true; draw(); msg("Questionnaire submitted. Thank you!", "ok");
    });
  };
  draw();
}

/* ---------- Opportunities, matching, applications (Phase 3) ---------- */
const CATEGORIES = ["Internship","Full-time Employment","Part-time Employment","Scholarship","Competition","Workshop","Training Programme","Professional Certification","Leadership Programme","Volunteering","Entrepreneurship","Sports and Recreation","International Exchange"];
const EDU = ["Secondary","Foundation / Pre-U","Diploma","Bachelor's degree","Master's degree","PhD","Other"];
const STATUS = { submitted:"Submitted", under_review:"Under review", shortlisted:"Shortlisted", accepted:"Accepted", rejected:"Rejected", withdrawn:"Withdrawn" };
const today = () => new Date().toISOString().slice(0, 10);
const OSEL = "*,organizations(name),opportunity_skills(skills(name))";
const OPEN = () => `deadline.is.null,deadline.gte.${today()}`;
const oSkills = o => (o.opportunity_skills || []).map(x => x.skills?.name).filter(Boolean);
const clean = t => t.replace(/[,()%*\\"]/g, " ").trim();
const oCard = (o, extra = "") => `<article class="card"><span class="tag">${esc(o.category)}</span>${o.is_demo ? '<span class="tag demo">Demo data</span>' : ""}
  <h3><a href="#/opportunity/${o.id}">${esc(o.title)}</a></h3><p>${esc(o.organizations?.name)} · ${esc(o.location || o.country_code || "")}</p>
  <p class="muted">${o.deadline ? "Closes " + esc(o.deadline) : "No deadline"}</p>${extra}</article>`;
const matchHtml = m => `<p><b>${m.pct}% match</b></p><ul class="opt-list">${m.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul>`;

/* Rule-based matcher. Modular: replace Matcher.score() with an AI model later; the weights below are shown to users. */
const REL = {
  "Internship": ["Internship opportunities","Industry exposure","Real-world project experience","Career exploration"],
  "Full-time Employment": ["Career exploration","Financial independence","Career satisfaction","Independent living"],
  "Part-time Employment": ["Financial independence","Work-life balance","Flexible working arrangements"],
  "Scholarship": ["Financial independence","Personal development"],
  "Competition": ["Real-world project experience","Leadership programmes","Personal development"],
  "Workshop": ["Personal development","Career exploration","Industry visits"],
  "Training Programme": ["Personal development","Career exploration","Career satisfaction"],
  "Professional Certification": ["Career satisfaction","Personal development","Career exploration"],
  "Leadership Programme": ["Leadership programmes","Mentorship","Personal development"],
  "Volunteering": ["Personal development","Professional networking"],
  "Entrepreneurship": ["Real-world project experience","Mentorship","Financial independence"],
  "Sports and Recreation": ["Health and wellness","Personal development"],
  "International Exchange": ["International exposure","Travel opportunities"] };
const Matcher = {
  W: { interest: 35, skills: 25, education: 20, location: 10, category: 10 },
  eligible: (st, o) => !o.education_level || o.education_level === "Any" || o.education_level === st.education_level,
  score(c, o) {
    const W = this.W, st = c.student, why = [];
    if (!this.eligible(st, o)) return null;                       // never recommend ineligible opportunities
    const picked = [...c.sel.exposure, ...c.sel.lifestyle], hits = (REL[o.category] || []).filter(x => picked.includes(x));
    const ind = o.industry && c.sel.industry.has(o.industry), n = hits.length + (ind ? 1 : 0);
    const interest = W.interest * Math.min(1, n / 2);
    if (hits.length) why.push("Fits your aspirations: " + hits.join(", "));
    if (ind) why.push("Industry you're interested in: " + o.industry);
    const names = oSkills(o), have = names.filter(x => c.levels[x] >= 3), grow = names.filter(x => c.improve.has(x) || c.sel.skills.has(x));
    const rel = names.filter(x => have.includes(x) || grow.includes(x));
    const skills = names.length ? W.skills * rel.length / names.length : 0;
    if (grow.length) why.push("Lets you develop: " + grow.join(", "));
    if (have.length) why.push("Uses skills you rated Intermediate or higher: " + have.join(", "));
    const education = W.education; why.push(o.education_level && o.education_level !== "Any" ? "Open to your education level" : "Open to all education levels");
    let location = 0;
    if (o.opportunity_type === "remote") { location = W.location; why.push("Remote – location doesn't matter"); }
    else if (o.country_code && st.country_code && o.country_code === st.country_code) {
      location = 6; const near = [o.state, o.city, o.location].filter(Boolean).map(x => x.toLowerCase());
      if ([st.state, st.city].filter(Boolean).some(x => near.some(y => y.includes(x.toLowerCase())))) location = W.location;
      why.push(location === W.location ? "Near you" : "In your country"); }
    const category = c.sel.opp_type.has(o.category) ? W.category : 0;
    if (category) why.push("A type of opportunity you asked for");
    return { pct: Math.round(interest + skills + education + location + category), why, grow };
  } };
async function matchCtx() {
  const [s, r, o, sk] = await Promise.all([sb.from("students").select("*").eq("id", profile.id).single(),
    sb.from("aspiration_responses").select("question_id,option_ids").eq("student_id", profile.id),
    sb.from("aspiration_options").select("id,label,aspiration_questions(q_key)"),
    sb.from("student_skills").select("level,want_to_improve,skills(name)").eq("student_id", profile.id)]);
  if (s.error || r.error || o.error || sk.error) throw new Error("ctx");
  const byId = {}; o.data.forEach(x => byId[x.id] = x);
  const sel = { exposure: new Set(), skills: new Set(), lifestyle: new Set(), industry: new Set(), opp_type: new Set() };
  r.data.forEach(x => x.option_ids.forEach(id => { const op = byId[id], k = op?.aspiration_questions?.q_key; if (sel[k]) sel[k].add(op.label); }));
  const levels = {}, improve = new Set();
  sk.data.forEach(x => { const n = x.skills?.name; if (!n) return; if (x.level) levels[n] = x.level; if (x.want_to_improve) improve.add(n); });
  return { student: s.data, sel, levels, improve };
}
async function recommend() {
  const c = await matchCtx();
  const { data, error } = await sb.from("opportunities").select(OSEL).eq("status", "published").or(OPEN()).limit(300);
  if (error) throw error;
  return data.map(o => ({ o, m: Matcher.score(c, o) })).filter(x => x.m && x.m.pct > 0).sort((a, b) => b.m.pct - a.m.pct);
}

async function exploreView() {

  app.innerHTML = `<main class="wrap" style="padding:32px 20px"><h1>Explore opportunities</h1>
    <div class="two"><div><label for="fq">Search</label><input id="fq" value="${esc(F.q)}" placeholder="Title or keyword"></div>
    <div><label for="fc">Category</label><select id="fc"><option value="">All</option>${opt(CATEGORIES, F.category)}</select></div>
    <div><label for="fl">Location</label><input id="fl" value="${esc(F.loc)}" placeholder="City or place"></div>
    <div><label for="fe">Education level</label><select id="fe"><option value="">Any</option>${opt(EDU, F.edu)}</select></div>
    <div><label for="fd">Closing date</label><select id="fd"><option value="">Any</option><option value="7" ${F.closing === "7" ? "selected" : ""}>Within 7 days</option><option value="30" ${F.closing === "30" ? "selected" : ""}>Within 30 days</option></select></div>
    <div><label for="fs">Sort by</label><select id="fs"><option value="deadline">Closing soonest</option><option value="new" ${F.sort === "new" ? "selected" : ""}>Newest</option></select></div></div>
    <p id="count" class="muted" role="status"></p><div class="grid" id="list"></div><div class="row pager" id="pager"></div></main>`;
  let t; const upd = () => { F.q = $("#fq").value; F.category = $("#fc").value; F.loc = $("#fl").value; F.edu = $("#fe").value; F.closing = $("#fd").value; F.sort = $("#fs").value; F.page = 0; clearTimeout(t); t = setTimeout(run, 300); };
  ["fq","fc","fl","fe","fd","fs"].forEach(id => $("#" + id).addEventListener("input", upd));
  async function run() {
    if (!sb) { $("#list").innerHTML = '<p class="empty">Connect Supabase to see opportunities.</p>'; return; }
    $("#list").innerHTML = '<p class="empty">Searching…</p>';
    let q = sb.from("opportunities").select(OSEL, { count: "exact" }).eq("status", "published").or(OPEN());
    if (clean(F.q)) q = q.or(`title.ilike.%${clean(F.q)}%,description.ilike.%${clean(F.q)}%`);
    if (F.category) q = q.eq("category", F.category);
    if (clean(F.loc)) q = q.ilike("location", `%${clean(F.loc)}%`);
    if (F.edu) q = q.or(`education_level.is.null,education_level.eq."${F.edu}"`);
    if (F.closing) q = q.not("deadline", "is", null).lte("deadline", new Date(Date.now() + F.closing * 864e5).toISOString().slice(0, 10));
    q = F.sort === "new" ? q.order("created_at", { ascending: false }) : q.order("deadline", { ascending: true, nullsFirst: false });
    const { data, count, error } = await q.range(F.page * PER, F.page * PER + PER - 1);
    if (error) { $("#list").innerHTML = '<p class="empty">Couldn\'t load opportunities. Try again.</p>'; return; }
    $("#count").textContent = `${count} ${count === 1 ? "opportunity" : "opportunities"} found`;
    $("#list").innerHTML = data.length ? data.map(o => oCard(o)).join("") : '<p class="empty">No opportunities match these filters. <a href="#" id="clr">Clear filters</a></p>';
    $("#clr")?.addEventListener("click", e => { e.preventDefault(); Object.assign(F, { q: "", category: "", loc: "", edu: "", closing: "", sort: "deadline", page: 0 }); exploreView(); });
    const pages = Math.max(1, Math.ceil(count / PER));
    $("#pager").innerHTML = count > PER ? `<button class="btn alt" id="pp" ${F.page ? "" : "disabled"}>Previous</button><span>Page ${F.page + 1} of ${pages}</span><button class="btn alt" id="pn" ${F.page + 1 >= pages ? "disabled" : ""}>Next</button>` : "";
    $("#pp")?.addEventListener("click", () => { F.page--; run(); }); $("#pn")?.addEventListener("click", () => { F.page++; run(); });
  }
  run();
}

        : `<p class="muted">Aggregated and anonymised · ${d.cohort} consenting students</p><h3>Top aspirations</h3>${barList(d.aspirations)}<h3>Preferred industries</h3>${barList(d.industries)}<h3>Skills students want to improve</h3>${barList(d.skills_to_improve)}`));
    } catch (e) { return show(i.verified ? '<p class="empty">Couldn\'t load insights.</p>' : '<div class="msg warn">Verification is required to view insights.</div>'); }
  }
  const [pg, en] = await Promise.all([sb.from("programmes").select("status").eq("institution_id", i.id), sb.from("enrollments").select("id", { count: "exact", head: true }).eq("status", "registered")]);
  const L = pg.data || [];
  show(`<h1>${esc(i.name)}</h1>${verPanel("institution", i, ver)}<div class="grid">${tile(L.filter(x => x.status === "published").length, "Published programmes")}${tile(L.filter(x => x.status === "pending").length, "Pending approval")}${tile(en.count ?? 0, "Registrations")}</div>`);

/* ----- Public programmes (students can register) ----- */
async function progListView() {
  if (!await studentOnly()) return;
  app.innerHTML = '<main class="wrap" style="padding:32px 20px"><h1>Programmes</h1><div id="msg" class="msg" hidden role="alert"></div><div class="grid" id="pl"><p class="empty">Loading…</p></div></main>';
  if (!sb) return $("#pl").innerHTML = '<p class="empty">Connect Supabase to see programmes.</p>';
  const isS = profile?.role === "student";
  const [pg, mine] = await Promise.all([sb.from("programmes").select("*,institutions(name)").eq("status", "published").order("start_date", { nullsFirst: false }),
    isS ? sb.from("enrollments").select("programme_id,status").eq("student_id", profile.id) : { data: [] }]);
  if (pg.error) return $("#pl").innerHTML = '<p class="empty">Couldn\'t load programmes. Try again.</p>';
  const reg = new Set((mine.data || []).filter(x => x.status === "registered").map(x => x.programme_id)), has = new Set((mine.data || []).map(x => x.programme_id));
  $("#pl").innerHTML = pg.data.length ? pg.data.map(x => `<article class="card"><span class="tag">${esc(x.kind)}</span><h3>${esc(x.title)}</h3><p>${esc(x.institutions?.name)} · ${esc(x.location || "")}</p><p>${esc(x.description)}</p><p class="muted">${x.start_date ? "Starts " + esc(x.start_date) : ""}</p>
    ${isS ? `<button class="btn ${reg.has(x.id) ? "alt" : ""}" data-p="${x.id}">${reg.has(x.id) ? "Cancel registration" : "Register"}</button>` : !profile ? '<a href="#/login">Log in to register</a>' : ""}</article>`).join("") : '<p class="empty">No programmes published yet.</p>';
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => { const id = b.dataset.p; b.disabled = true;
    const r = reg.has(id) ? await sb.from("enrollments").update({ status: "cancelled" }).eq("programme_id", id).eq("student_id", profile.id)
      : has.has(id) ? await sb.from("enrollments").update({ status: "registered" }).eq("programme_id", id).eq("student_id", profile.id) : await sb.from("enrollments").insert({ programme_id: id, student_id: profile.id });
    r.error ? (b.disabled = false, msg("Couldn't update your registration.")) : progListView(); });
}

/* ----- Admin ----- */
const ADM_L = [["admin", "Overview"], ["admin/users", "Users"], ["admin/verif", "Verifications"], ["admin/opps", "Listings"], ["admin/audit", "Audit log"]];
async function adminView(p) {
  if (!await roleGuard("admin")) return;
  if (p[0] === "profile") return accountPage(true);
  portal(ADM_L, '<p class="empty">Loading…</p>'); const show = h => portal(ADM_L, h), view = p[0] || "";
  const act = (sel, fn, ok) => document.querySelectorAll(sel).forEach(b => b.onclick = async () => { b.disabled = true; try { await fn(b); route(); } catch (e) { b.disabled = false; if (e !== 0) msg("Action failed. Try again."); } });
  if (view === "users") {
    const q = $("#uq")?.value; let rq = sb.from("profiles").select("id,email,full_name,role,status,created_at").order("created_at", { ascending: false }).limit(100);
    show(`<h1>Users</h1><div class="two"><div><label for="uq">Search name or email</label><input id="uq"></div><div><label for="ur">Role</label><select id="ur"><option value="">All</option>${["student","organization","institution","admin"].map(r => `<option>${r}</option>`).join("")}</select></div></div>
      <div class="row"><button class="btn" id="us">Search</button></div><div id="ul" style="margin-top:16px"></div>`);
    const load = async () => { $("#ul").innerHTML = '<p class="empty">Loading…</p>'; let r = sb.from("profiles").select("id,email,full_name,role,status,created_at").order("created_at", { ascending: false }).limit(100);
      const t = clean($("#uq").value); if (t) r = r.or(`email.ilike.%${t}%,full_name.ilike.%${t}%`); if ($("#ur").value) r = r.eq("role", $("#ur").value);
      const { data, error } = await r; if (error) return $("#ul").innerHTML = '<p class="empty">Couldn\'t load users.</p>';
      $("#ul").innerHTML = data.length ? data.map(u => `<div class="card" style="margin:8px 0"><b>${esc(u.full_name || "(no name)")}</b> · ${esc(u.email)} <span class="tag">${esc(u.role)}</span><span class="tag ${u.status === "suspended" ? "demo" : ""}">${esc(u.status)}</span>
        ${u.id !== profile.id ? `<button class="btn alt" data-u="${u.id}" data-s="${u.status === "active" ? "suspended" : "active"}">${u.status === "active" ? "Suspend" : "Activate"}</button>` : ""}</div>`).join("") : '<p class="empty">No users match.</p>';
      document.querySelectorAll("[data-u]").forEach(b => b.onclick = async () => { if (!confirm(`${b.textContent} this account?`)) return; b.disabled = true;
        try { await rpc("admin_set_user_status", { p_user: b.dataset.u, p_status: b.dataset.s }); load(); } catch (e) { b.disabled = false; msg("Action failed."); } }); };
    $("#us").onclick = load; load(); return;
  }
  if (view === "verif") {
    const [a, b] = await Promise.all([sb.from("organization_verifications").select("id,created_at,organizations(name,org_type,registration_no,website)").eq("status", "pending"),
      sb.from("institution_verifications").select("id,created_at,institutions(name,inst_type,accreditation,website)").eq("status", "pending")]);
    if (a.error || b.error) return show('<p class="empty">Couldn\'t load requests.</p>');
    const items = [...a.data.map(x => ({ k: "organization", id: x.id, e: x.organizations })), ...b.data.map(x => ({ k: "institution", id: x.id, e: x.institutions }))];
    show(`<h1>Verification requests</h1>` + (items.length ? items.map(x => `<article class="card" style="margin:12px 0"><span class="tag">${x.k}</span><h3>${esc(x.e?.name)}</h3>
      <p>${esc([x.e?.org_type || x.e?.inst_type, x.e?.registration_no || x.e?.accreditation, x.e?.website].filter(Boolean).join(" · "))}</p>
      <div class="row"><button class="btn" data-v="${x.id}" data-k="${x.k}" data-a="1">Approve</button><button class="btn alt" data-v="${x.id}" data-k="${x.k}" data-a="0">Reject</button></div></article>`).join("") : '<p class="empty">No pending requests.</p>'));
    act("[data-v]", async b => { const ok = b.dataset.a === "1", note = ok ? null : prompt("Reason for rejection (shown to them):"); if (!ok && note === null) throw 0; if (!confirm(ok ? "Approve this request?" : "Reject this request?")) throw 0;
      if (b.dataset.k === "organization") {
        await rpc("review_organization", {
          p_verification_id: b.dataset.v,
          p_decision: ok ? "approved" : "rejected",
          p_note: note
        });
      } else {
        // Keep the existing institution-verification workflow unchanged.
        await rpc("admin_review_verification", { p_kind: b.dataset.k, p_id: b.dataset.v, p_approve: ok, p_note: note });
      }
    }); return;
  }
  if (view === "opps") {
    const [o, g] = await Promise.all([sb.from("opportunities").select("id,title,status,is_featured,is_demo,organizations(name)").order("created_at", { ascending: false }).limit(100),
      sb.from("programmes").select("id,title,status,kind,institutions(name)").order("created_at", { ascending: false }).limit(100)]);
    if (o.error || g.error) return show('<p class="empty">Couldn\'t load listings.</p>');
    const btns = (k, x) => `${x.status !== "published" ? `<button class="btn" data-r="${x.id}" data-k="${k}" data-d="published">Approve</button>` : ""}${x.status !== "rejected" ? `<button class="btn alt" data-r="${x.id}" data-k="${k}" data-d="rejected">Reject</button>` : ""}`;
    show(`<h1>Opportunities</h1>` + (o.data.map(x => `<div class="card" style="margin:8px 0"><span class="tag">${esc(x.status)}</span>${x.is_demo ? '<span class="tag demo">Demo</span>' : ""}<b>${esc(x.title)}</b> · ${esc(x.organizations?.name)}
      <div class="row">${btns("opportunity", x)}<button class="btn alt" data-f="${x.id}" data-v="${!x.is_featured}">${x.is_featured ? "Unfeature" : "Feature"}</button><button class="btn alt" data-del="${x.id}">Remove</button></div></div>`).join("") || '<p class="empty">None yet.</p>') +
      `<h1>Programmes</h1>` + (g.data.map(x => `<div class="card" style="margin:8px 0"><span class="tag">${esc(x.status)}</span><b>${esc(x.title)}</b> · ${esc(x.institutions?.name)}<div class="row">${btns("programme", x)}</div></div>`).join("") || '<p class="empty">None yet.</p>'));
    act("[data-r]", async b => { if (!confirm(b.textContent + " this listing?")) throw 0; await rpc("admin_review_item", { p_kind: b.dataset.k, p_id: b.dataset.r, p_decision: b.dataset.d }); });
    act("[data-f]", async b => rpc("admin_set_featured", { p_id: b.dataset.f, p_featured: b.dataset.v === "true" }));
    act("[data-del]", async b => { if (!confirm("Permanently remove this listing?")) throw 0; const r = await sb.from("opportunities").delete().eq("id", b.dataset.del); if (r.error) throw r.error; });
    return;
  }
  if (view === "audit") {
    const { data, error } = await sb.from("audit_logs").select("*").order("created_at", { ascending: false }).limit(50);
    return show(`<h1>Audit log</h1>` + (error ? '<p class="empty">Couldn\'t load the log.</p>' : data.length ? data.map(l => `<p><span class="muted">${esc(l.created_at.slice(0, 16).replace("T", " "))}</span> <b>${esc(l.action)}</b> ${esc(l.entity || "")} <span class="muted">${esc((l.entity_id || "").slice(0, 8))}</span></p>`).join("") : '<p class="empty">No actions recorded yet.</p>'));
  }
  try { const d = await rpc("admin_stats"), n = d.insights;
    show(`<h1>Overview</h1><div class="grid">${tile(d.students, "Students")}${tile(d.organizations, "Organizations (real)")}${tile(d.institutions, "Institutions")}${tile(d.published, "Published opportunities (real)")}${tile(d.pending_opps, "Opportunities awaiting approval")}${tile(d.pending_verifications, "Pending verifications")}</div>
      <h2 style="margin-top:32px">Student aspirations</h2>${barList(n.aspirations)}<h2>Preferred industries</h2>${barList(n.industries)}<h2>Most requested skills to improve</h2>${barList(n.skills_to_improve)}
      <p class="muted">Counts are live from the database and exclude demonstration data where noted.</p>`);
  } catch (e) { show('<p class="empty">Couldn\'t load analytics.</p>'); }
}

/* ---------- Profile / account page (admin: #/admin/profile, everyone else: #/account) ---------- */
const AVATAR_BUCKET = "avatars";   // Supabase Storage bucket (public). See setup notes.
const AV_TYPES = ["image/jpeg", "image/png", "image/webp"], AV_MAX = 2 * 1024 * 1024;
const squareJpeg = file => new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image();
  im.onload = () => { const n = Math.min(im.width, im.height), c = document.createElement("canvas"); c.width = c.height = 512; const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, 512, 512); x.drawImage(im, (im.width - n) / 2, (im.height - n) / 2, n, n, 0, 0, 512, 512); URL.revokeObjectURL(u);
    c.toBlob(b => b ? res(b) : rej(new Error("Couldn't process the image.")), "image/jpeg", .9); };
  im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Couldn't read that image.")); }; im.src = u; });
async function accountPage(isAdmin) {
  if (!sb) { app.innerHTML = '<main class="wrap" style="padding:32px 20px"><div class="msg warn">Supabase isn\'t configured.</div></main>'; return; }
  if (!isAdmin) {
    await loadProfile(); renderNav();
    if (!profile) return go("#/login");
    if (profile.status === "suspended") { await sb.auth.signOut(); profile = null; renderNav(); return go("#/login"); }
    if (profile.role === "admin") return go("#/admin/profile");
  }
  const p = profile;
  const pg = h => isAdmin ? portal(ADM_L, h) : (app.innerHTML = `<main class="wrap" style="padding:32px 20px"><div id="msg" class="msg" hidden role="alert"></div>${h}</main>`);
  const note = (t, ty) => { msg(t, ty); $("#msg")?.scrollIntoView({ behavior: "smooth", block: "center" }); };
  const created = p.created_at ? new Date(p.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "–";
  pg(`<h1>${isAdmin ? "My profile" : "Account settings"}</h1>
    <div class="pf-grid">
      <div class="card pf-side"><div class="avatar lg" id="pfAv">${avInner(p)}</div>
        <div class="row"><button class="btn alt" type="button" id="pfPick">Change photo</button>${p.avatar_url ? '<button class="btn alt" type="button" id="pfRm">Remove</button>' : ""}</div>
        <input type="file" id="pfFile" accept="image/jpeg,image/png,image/webp" hidden>
        <p class="hint">JPG, JPEG, PNG or WebP, up to 2 MB. Shown as a circle.</p><span class="tag">${esc(ROLES[p.role] || p.role)}</span></div>
      <div>
        <form class="card pf-card" id="pff" novalidate><h3>Profile details</h3><div class="two">
          <div><label for="pfName">Full name</label><input id="pfName" value="${esc(p.full_name)}" autocomplete="name" maxlength="120"></div>
          <div><label for="pfEmail">Email</label><input id="pfEmail" value="${esc(p.email)}" readonly></div>
          <div><label for="pfRole">Role</label><input id="pfRole" value="${esc(ROLES[p.role] || p.role)}" readonly></div>
          <div><label for="pfDate">Account created</label><input id="pfDate" value="${esc(created)}" readonly></div></div>
          <div class="row"><button class="btn" type="submit">Save changes</button><button class="btn alt" type="button" id="pfCancel">Cancel</button></div></form>
        <form class="card pf-card" id="pwf" novalidate><h3>Change password</h3><div class="two">
          <div><label for="pfPw">New password</label><input id="pfPw" type="password" autocomplete="new-password" minlength="8"></div>
          <div><label for="pfPw2">Confirm new password</label><input id="pfPw2" type="password" autocomplete="new-password" minlength="8"></div></div>
          <div class="row"><button class="btn alt" type="submit">Update password</button></div></form>
      </div></div>`);
  let file = null, removing = false; const av = $("#pfAv"), iniOnly = `<span class="ini">${esc((p.full_name || p.email || "?").trim().charAt(0).toUpperCase())}</span>`;
  $("#pfPick").onclick = () => $("#pfFile").click();
  $("#pfFile").onchange = e => { const f = e.target.files[0]; if (!f) return;
    if (!AV_TYPES.includes(f.type)) { e.target.value = ""; return note("Please choose a JPG, PNG or WebP image."); }
    if (f.size > AV_MAX) { e.target.value = ""; return note("That image is larger than 2 MB. Choose a smaller one."); }
    file = f; removing = false; av.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="Preview">${iniOnly}`; note("Preview only. Click Save changes to apply this photo.", "warn"); };
  const rm = $("#pfRm"); if (rm) rm.onclick = () => { file = null; removing = true; $("#pfFile").value = ""; av.innerHTML = iniOnly; note("Photo will be removed when you click Save changes.", "warn"); };
  $("#pfCancel").onclick = () => accountPage(isAdmin);
  $("#pff").onsubmit = async e => { e.preventDefault();
    const name = $("#pfName").value.trim(); if (!name) return note("Enter your full name.");
    const b = e.target.querySelector("button[type=submit]"); busy(b, true); const ok = [], bad = [];
    // Only full_name and avatar_url are ever sent – never role or status.
    if (name !== (p.full_name || "")) { const r = await sb.from("profiles").update({ full_name: name }).eq("id", p.id); r.error ? bad.push("Your name couldn't be saved.") : ok.push("name"); }
    if (file || removing) {
      try {
        let url = null;
        if (file) { const blob = await squareJpeg(file), path = `${p.id}/avatar.jpg`;
          const up = await sb.storage.from(AVATAR_BUCKET).upload(path, blob, { upsert: true, contentType: "image/jpeg", cacheControl: "3600" }); if (up.error) throw up.error;
          url = sb.storage.from(AVATAR_BUCKET).getPublicUrl(path).data.publicUrl + "?v=" + Date.now(); }
        const r = await sb.from("profiles").update({ avatar_url: url }).eq("id", p.id); if (r.error) throw r.error;
        ok.push("photo");
      } catch (er) { const m = er?.message || "";
        bad.push(/bucket/i.test(m) ? "Photo storage isn't set up yet, so the photo wasn't saved. Your initial is shown instead." : /avatar_url/i.test(m) ? "The profiles table has no avatar_url column yet, so the photo wasn't saved." : "The photo couldn't be saved" + (m ? " (" + m + ")." : ".")); }
    }
    busy(b, false);
    if (!ok.length && !bad.length) return note("No changes to save.", "warn");
    await loadProfile(); renderNav(); if (!profile) return go("#/login");
    await accountPage(isAdmin);
    note(bad.length ? (ok.length ? "Some changes were saved. " : "") + bad.join(" ") : "Profile updated.", bad.length ? "err" : "ok"); };
  $("#pwf").onsubmit = async e => { e.preventDefault(); const a = $("#pfPw").value;
    if (a.length < 8) return note("Password must be at least 8 characters.");
    if (a !== $("#pfPw2").value) return note("The two passwords don't match.");
    const b = e.target.querySelector("button"); busy(b, true); const { error } = await sb.auth.updateUser({ password: a }); busy(b, false);
    if (error) return note(error.message); e.target.reset(); note("Password updated.", "ok"); };
}

/* ---------- Router ---------- */
async function route() {
  const h = location.hash.replace(/^#/, "") || "/";
  if (h === "featured") return;
  if (recovery) return resetPw();
  const path = h.split("?")[0];
  if (path === "/login" || path === "/register") { await loadProfile(); if (profile) return rep("#/dashboard"); return path === "/login" ? login() : register(); }
  if (path === "/account") return accountPage(false);
  const seg = path.split("/").filter(Boolean);
  if (seg[0] === "org") return orgView(seg.slice(1));
  if (seg[0] === "inst") return instView(seg.slice(1));
  if (seg[0] === "admin") return adminView(seg.slice(1));
  if (path === "/programmes") return progListView();
  if (path === "/opportunities") return exploreView();
  if (path.startsWith("/opportunity/")) return oppView(path.split("/")[2]);
  if (path === "/recommended") return recView();
  if (path === "/saved") return savedView();
  if (path === "/applications") return appsView();
  if (path === "/profile") return profileView();
  if (path === "/aspirations") return aspView();
  if (path === "/skills") return skillsView();
  if (path === "/dashboard") { await loadProfile(); renderNav(); const r = profile?.role; if (r === "organization") return go("#/org"); if (r === "institution") return go("#/inst"); if (r === "admin") return go("#/admin"); return r === "student" ? studentDash() : dashboard(); }
  await loadProfile();
  if (profile) { renderNav(); return rep("#/dashboard"); }   // Home is for guests only
  renderNav(); return home();
}
window.addEventListener("hashchange", route);
/* highlight the current page in the top nav and in-app pill nav */
function markActive(){const h=location.hash||"#/";document.querySelectorAll("nav a.l, main.wrap>p:first-child a").forEach(a=>{const t=a.getAttribute("href");t===h||(t!=="#/"&&t.length>2&&h.startsWith(t+"/"))?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")})}
new MutationObserver(markActive).observe(app,{childList:true});new MutationObserver(markActive).observe($("#navAuth"),{childList:true});new MutationObserver(markActive).observe($("#navLinks"),{childList:true});window.addEventListener("hashchange",markActive);markActive();
if (sb) sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { recovery = true; route(); } });
(async () => { await loadProfile(); renderNav(); route(); })();
</script>
